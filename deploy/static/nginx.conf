# Include in the dedicated mtp.twiling.ru HTTPS server block after obtaining TLS.
# Keep all neighbouring server blocks and their upstreams intact.
root /srv/mtp/current;
index index.html;

# Filenames include unversioned entry points; PWA handles its own version cache.
# Do not enable open_file_cache here: current switches atomically between releases.
open_file_cache off;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;

location / {
    try_files $uri $uri/ =404;
}

location ~ /\. {
    deny all;
}
