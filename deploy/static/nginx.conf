# Include in the dedicated mtp.twiling.ru HTTPS server block after obtaining TLS.
# Keep all neighbouring server blocks and their upstreams intact.
root /srv/mtp/current;
index index.html;

# Filenames include unversioned entry points; PWA handles its own version cache.
# Do not enable open_file_cache here: current switches atomically between releases.
open_file_cache off;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://invest-brands.cdn-tinkoff.ru; connect-src 'self' https://invest-public-api.tbank.ru wss://invest-public-api.tbank.ru https://accounts.google.com/gsi/ https://www.googleapis.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

location / {
    try_files $uri $uri/ =404;
}

location ~ /\. {
    deny all;
}
